include /opt/chambalink/deploy/nginx/cloudflare-real-ip.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chambalink.online www.chambalink.online;

    ssl_certificate     /etc/ssl/chambalink/origin.pem;
    ssl_certificate_key /etc/ssl/chambalink/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
