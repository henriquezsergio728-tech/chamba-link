upstream chambalink_api {
    server 127.0.0.1:3000;
    keepalive 64;
    keepalive_timeout 30s;
}

include /opt/chambalink/deploy/nginx/cloudflare-real-ip.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chambalink.online www.chambalink.online;

    ssl_certificate     /etc/ssl/chambalink/origin.pem;
    ssl_certificate_key /etc/ssl/chambalink/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The landing page and its assets are files in the clone. Every other path goes to the API.
    location = / {
        root /opt/chambalink/web/public;
        try_files /index.html =404;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /landing.css {
        root /opt/chambalink/web/public;
    }

    location = /styles/tokens.css {
        root /opt/chambalink/web/src;
    }

    location ~ ^/brand/[a-z-]+\.svg$ {
        root /opt/chambalink/web/src;
    }

    location / {
        proxy_pass http://chambalink_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
