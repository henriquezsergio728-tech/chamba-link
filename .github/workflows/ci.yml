name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16@sha256:8e011e58c789a89790269f53614a28a58cb02706ce74ba6d9d4171613d0b75e1
        env:
          POSTGRES_USER: chamba
          POSTGRES_PASSWORD: chamba
          POSTGRES_DB: chamba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chamba -d chamba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chamba:chamba@127.0.0.1:5432/chamba
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @chamba/api exec drizzle-kit migrate
      - run: pnpm test

  image:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/henriquezsergio728-tech/chamba-link-api
    steps:
      - uses: actions/checkout@v7
      - name: Build (native arm64)
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
      - name: Migrate (shipped migrator, fresh Postgres, run twice)
        run: |
          docker network create ci
          docker run -d --name pg --network ci -e POSTGRES_USER=chamba -e POSTGRES_PASSWORD=chamba -e POSTGRES_DB=chamba postgres:16@sha256:8e011e58c789a89790269f53614a28a58cb02706ce74ba6d9d4171613d0b75e1
          for _ in $(seq 60); do docker exec pg pg_isready -h 127.0.0.1 -U chamba -d chamba && break; sleep 1; done
          docker exec pg pg_isready -h 127.0.0.1 -U chamba -d chamba
          for _ in 1 2; do docker run --rm --network ci -e DATABASE_URL=postgres://chamba:chamba@pg:5432/chamba "$IMAGE:$GITHUB_SHA" node dist/migrate.js; done
          test "$(docker exec pg psql -U chamba -d chamba -tAc "select count(*) from pg_constraint where conname in ('bookings_no_provider_overlap','bookings_during_bounded')")" = 2
          docker rm -f pg
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:3000:3000 "$IMAGE:$GITHUB_SHA"
          curl -fsS --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:3000/healthz || { docker ps -a; docker logs smoke; exit 1; }
          docker rm -f smoke
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
