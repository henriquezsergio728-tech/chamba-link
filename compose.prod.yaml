services:
  api:
    image: ghcr.io/henriquezsergio728-tech/chamba-link-api:${API_TAG:?set API_TAG in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:3000:3000"
