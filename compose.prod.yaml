services:
  api:
    image: ghcr.io/henriquezsergio728-tech/chamba-link-api:${API_TAG:?set API_TAG in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
    ports:
      - "127.0.0.1:3000:3000"

  # The migrator connects as the table owner; only this service receives MIGRATE_DATABASE_URL. Run with docker compose run --rm migrate.
  migrate:
    image: ghcr.io/henriquezsergio728-tech/chamba-link-api:${API_TAG:?set API_TAG in .env}
    profiles: ["migrate"]
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL in .env}
